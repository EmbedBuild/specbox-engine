<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrada animada</title>
<style>
  body { margin: 0; font: 16px/1.5 Georgia, serif; color: #1e2329; background: #fff; }
  main { max-width: 40rem; margin: 0 auto; padding: 1.5rem 1rem; }
  @keyframes entra { from { opacity: 0; } to { opacity: 1; } }
  .nota { animation: entra .8s .6s both; border-left: 3px solid #1e2329; padding-left: .75rem; }
</style>
</head>
<body>
<main>
  <h1>Propuesta para el taller</h1>
  <p class="nota">Aquí se frenó la lectura</p>
</main>
</body>
</html>
