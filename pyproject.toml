[project]
name = "specbox-engine"
version = "6.6.0"
description = "SpecBox Engine v6.6.0 — VSCode Discoverability: the VSCode extension sidebar auto-detects skills from filesystem, groups them in 7 canonical categories (Pipeline / Quality / Visual / Tracking / Stripe / Lifecycle / Other), and opens a help card on click with 4 blocks (what / when / command / example) + copy-to-clipboard button. New walkthrough step 'Explore your skills'. 20 new node:test cases, 34/34 green."
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.3.1,<4.0.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "fpdf2>=2.8.0",
    "markdown>=3.5",
    "structlog>=24.0.0",
    "reportlab>=4.0.0",
    "asyncpg>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.22.0",
    "ruff>=0.5.0",
]
# Optional external tools for the Quality Audit (ISO/IEC 25010) module.
# All are auto-detected; missing tools degrade gracefully at runtime.
audit = [
    "semgrep>=1.70.0",
    "pip-audit>=2.7.0",
    "lizard>=1.17.0",
]

[project.scripts]
specbox-engine = "server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"

# asyncpg ships no type stubs / py.typed marker; ignore its missing imports.
[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true
