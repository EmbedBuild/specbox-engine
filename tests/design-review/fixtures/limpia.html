<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Propuestas pendientes</title>
<style>
  body { margin: 0; font: 16px/1.5 Georgia, serif; color: #1e2329; background: #fff; }
  main { max-width: 40rem; margin: 0 auto; padding: 1.5rem 1rem; }
  h1 { font-size: 1.75rem; margin: 0 0 1rem; }
  .fila { display: flex; justify-content: space-between; gap: 1rem; padding: .75rem 0; border-bottom: 1px solid #d5d9dd; }
  .importe { font-variant-numeric: tabular-nums; }
  .boton { min-height: 44px; min-width: 44px; padding: .6rem 1rem; border: 0; border-radius: 6px;
           background: #1e2329; color: #fff; font: inherit; cursor: pointer;
           transition-property: background-color; transition-duration: .15s; }
  .secundario { color: #59616a; }
</style>
</head>
<body>
<main>
  <h1>Propuestas pendientes</h1>
  <div class="fila"><span>Reforma cocina Ruiz</span><span class="importe">4.800 €</span></div>
  <div class="fila"><span>Baño planta alta</span><span class="importe">2.150 €</span></div>
  <p class="secundario">Dos propuestas sin abrir desde el lunes.</p>
  <button class="boton">Enviar recordatorio</button>
</main>
</body>
</html>
