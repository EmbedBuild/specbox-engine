name: specbox CLI

# UC-3904 — `specbox login` / status / logout y el ayudante de cabeceras que
# ejecuta Claude Code. Sin dependencias: se prueba con node:test en los tres
# sistemas (cada uno usa un almacén seguro distinto) y en la Node más antigua
# que declara el paquete.

on:
  pull_request:
    paths:
      - 'packages/specbox-cli/**'
      - '.github/workflows/specbox-cli.yml'
      - '.github/workflows/publish-specbox-cli.yml'
      - 'scripts/npm-publish-and-wait.sh'
      - 'scripts/tests/test-npm-publish-and-wait.sh'
  push:
    branches: [main]
    paths:
      - 'packages/specbox-cli/**'
      - 'scripts/npm-publish-and-wait.sh'
      - 'scripts/tests/test-npm-publish-and-wait.sh'

jobs:
  # UC-5902 — el paso de publicación espera a npm aunque la versión quede «staged».
  publish-wait:
    name: Publicar y esperar a npm (script)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pruebas con un npm falso
        run: bash scripts/tests/test-npm-publish-and-wait.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['18', '22']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Tests
        working-directory: packages/specbox-cli
        shell: bash
        run: node --test test/*.test.mjs
      - name: El paquete publica solo bin, lib y README
        working-directory: packages/specbox-cli
        shell: bash
        run: |
          npm pack --dry-run --json > pack.json
          node -e "
            // npm ≤ 11 prints an array; npm ≥ 12 prints an object keyed by package name.
            const out = require('./pack.json');
            const pkg = Array.isArray(out) ? out[0] : (out.files ? out : Object.values(out)[0]);
            const files = (pkg.files || []).map(f => f.path);
            if (!files.length) { console.error('npm pack no devolvió ficheros:', JSON.stringify(out).slice(0, 300)); process.exit(1); }
            const bad = files.filter(p => !/^(bin|lib)\//.test(p) && !['README.md', 'package.json'].includes(p));
            if (bad.length) { console.error('Ficheros inesperados en el paquete:', bad); process.exit(1); }
            console.log(files.join('\n'));
          "
