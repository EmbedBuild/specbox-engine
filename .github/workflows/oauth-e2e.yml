name: OAuth E2E

# UC-650 — runs the mock-cloud ↔ loopback round-trip plus the unit suite.
# Full @vscode/test-electron + Playwright matrix lands once US-09 of the cloud
# (EmbedBuild/specbox_cloud) is in production and the test secrets are wired.

# US-121 (UC-12101): manual only. The real check is `bash scripts/ci-local.sh extension`,
# which runs the same locally before every PR. Launch by hand when closing a large block:
# gh workflow run oauth-e2e.yml -R EmbedBuild/specbox-engine --ref <branch>
on:
  workflow_dispatch:

jobs:
  oauth-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: vscode-extension
        run: npm install

      - name: Compile vscode-extension
        working-directory: vscode-extension
        run: npm run compile

      - name: Lint i18n strings
        run: node scripts/lint-extension-strings.mjs

      - name: Run OAuth unit + integration tests
        working-directory: vscode-extension
        run: npm test

  report-failure:
    if: failure()
    needs: oauth-e2e
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open follow-up issue on failure
        uses: actions/github-script@v7
        with:
          script: |
            const title = `oauth-e2e failed on ${context.sha.slice(0,7)}`;
            const body = [
              `OAuth E2E workflow failed on commit ${context.sha}.`,
              `See run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['oauth-e2e-fail'],
            });
