name: Hooks

# UC-7201 / UC-7204 (US-72) — the hooks are the control SpecBox sells, so their
# tests run on every PR that touches them: the hook suites, and the check that
# templates/settings.json.template (what projects receive) wires the same hooks
# as the engine, with every unwired hook decided in NOT_WIRED. Seconds, not
# minutes: no Python, no Postgres.

on:
  pull_request:
    paths:
      - ".claude/hooks/**"
      - ".claude/settings.json"
      - "templates/settings.json.template"
      - "tests/hooks/**"
      - ".github/workflows/hooks.yml"
  push:
    branches: [main]
    paths:
      - ".claude/hooks/**"
      - ".claude/settings.json"
      - "templates/settings.json.template"
      - "tests/hooks/**"
      - ".github/workflows/hooks.yml"

permissions:
  contents: read

concurrency:
  group: hooks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hooks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Hook tests and settings template parity
        run: node --test tests/hooks/*.test.mjs .claude/hooks/lib/*.test.mjs

      - name: Hook smoke tests
        run: node .claude/hooks/test-hooks.mjs
