services:
  specbox-engine:
    build: .
    container_name: specbox-engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - engine-state:/data/state
    environment:
      - MCP_TRANSPORT=http
      - MCP_PORT=8000
      # UC-10806: a remote server does not start without its policy for requests
      # without a token (off | grace | enforce); see doc/runbooks/transport-auth.md.
      - SPECBOX_TRANSPORT_AUTH=${SPECBOX_TRANSPORT_AUTH:?set SPECBOX_TRANSPORT_AUTH to off, grace or enforce}
      - SPECBOX_TRANSPORT_AUTH_GRACE_UNTIL=${SPECBOX_TRANSPORT_AUTH_GRACE_UNTIL:-}
      - LOG_FORMAT=json
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  engine-state:
