# CI local en GitHub, solo a mano (regla de EmbedBuild del 2026-10-08: nada se dispara con push ni
# pull_request). Lanza el mismo scripts/ci-local.sh que se pasa en local:
#   gh workflow run ci-local.yml -R EmbedBuild/specbox-engine --ref <rama>
name: CI local (a mano)
on:
  workflow_dispatch:
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: gitleaks 8.30.1
        run: curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks
      - run: bash scripts/ci-local.sh
