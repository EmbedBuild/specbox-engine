changelog:
  6.0.2:
    date: 2026-05-25
    codename: "Smoke Test Followups"
    summary: >
      Patch release that closes the 3 GitHub issues (#60, #61, #62) surfaced
      during the v6.0.1 smoke test, plus removes the long-standing hardcoded
      engine version literal in server/server.py (now reads ENGINE_VERSION.yaml
      at module load). Also bumps fastmcp 3.1.0 → 3.3.1 (security hardening,
      pin upper-bounded). Zero behaviour changes for non-deprecated tools.
    changes:
      - "feat(audit): submit_quality_audit autogenerates audit_id server-side (format audit_YYYYMMDDTHHMMSSZ) when the client does not provide one. Clients that need idempotency can still pass their own audit_id and it is respected verbatim. Closes #61."
      - "fix(audit): run_quality_audit deprecation shim now raises RuntimeError when invoked without report — the MCP envelope correctly flags isError=true so clients that only inspect the envelope (not the structured payload) notice the deprecation instead of treating it as silent success. Closes #60."
      - "fix(discovery): validate_discovery_completeness parser accepts all 4 canonical drift resolutions — feature_creep_rejected, app_market_updated, documented_exception, no_drift — instead of 3. Legacy 'no drift detected' (with spaces) is normalised to 'no_drift'. New drift.kind field exposes which resolution matched, enabling future strict-gate modes without another release. Closes #62."
      - "fix(audit): bug latente eliminado — submit_quality_audit.fn(...) was always invalid from the closure scope (AttributeError), only avoided crashing because the test exercising it was pytest.skip-eado due to a missing QualityReport.empty() helper. Refactor to direct call. Test fixture rebuilt without the missing helper, unskipping 3 previously-hidden tests."
      - "feat(server): engine version in FastMCP(instructions=...) is now read from ENGINE_VERSION.yaml at module load via new _load_engine_version() helper, mirroring the dashboard_api._health_version pattern. Removes the hardcoded 'v5.29.0' literal that drifted across releases and made remote MCP clients see stale versions on every connect."
      - "chore(deps): bump fastmcp >=3.0.0 → >=3.3.1,<4.0.0 (latest stable 2026-05-15, security hardening). Pin upper-bounded to prevent silent major jumps. Suite verde 1243 passed / 71 skipped / 0 failed. No API changes consumed by our tools."
      - "docs(discovery skill): SKILL.md Paso 3 documents the 4 canonical drift resolutions explicitly (was 3) and adds case (d) no_drift for inherited features that introduce no ICPs/JTBDs."
      - "docs(CLAUDE.md): tool count corrected from stale 167/159 → 176 (actual count via mcp.list_tools()). Engine Version footer + header bumped to v6.0.2."
      - "compat: 100% backwards-compatible. Clients calling submit_quality_audit without audit_id now succeed (used to error). Clients only inspecting MCP isError on run_quality_audit deprecation now see the right value (used to see false). No breaking schema changes."
      - "tests: +11 passed / -2 skipped (the unskipped ones now run). 6 new drift parsing cases in test_discovery_content_api.py (TestDriftResolutionParsing), 2 new audit_id cases in test_audit_content_api.py (autogenerated + respected), 1 new test_engine_version_read_from_yaml_not_hardcoded in test_server.py. Final suite: 1243 passed / 71 skipped / 0 failed in 28.5s."

  6.0.1:
    date: 2026-05-25
    codename: "MCP Path Contract"
    summary: >
      Architectural hotfix — migrates 17 cat-A tools in server/tools/ to a
      universal content-passing API. No @mcp.tool registered function resolves
      Path(project_path).resolve() against the host filesystem; the client
      reads files locally and passes content as string. Fixes silent-fake-data
      bug in remote MCP setups (SPECBOX_ENGINE_MCP_URL=...). See
      doc/decisions/mcp_path_contract.md and doc/plans/v6.0.1_mcp_path_contract_plan.md.

  6.0.0:
    date: 2026-05-24
    codename: "Discovery Foundations"
    summary: >
      Introduces /discovery as a permanent module in the canonical pipeline
      (/discovery → /prd → /plan → /implement) + the third canonical document
      doc/app/app_market.md (ICPs + JTBDs globales + NSM + positioning) + the
      multi-doc registry foundation (server/app_docs/registry.py) that makes
      adding more canonical docs in v6.x trivial. 100% backwards-compatible —
      v5.x projects get app_market.md as template-pristine via upgrade_project.

  5.35.0:
    date: 2026-05-25
    codename: "Reservation Rename"
    summary: >
      Renames the Native Backend coordination concept from "claim" (jargon —
      claim check pattern, JWT claims) to "reservation" (universally
      understood: table, room, library) end-to-end across SQL schema, Python
      module, MCP tools, error payloads, tests and docs. Backwards-compatible
      via deprecated aliases that stay live until v5.37.0 (UC-612).
    changes:
      - "feat(db): SQL migration 0007_rename_claims_to_reservations.sql (canonical at server/db/migrations/0007_*.sql + Supabase mirror at supabase/migrations/20260524000007_*.sql) — renames table uc_claims → uc_reservations, column claimed_at → reserved_at, index idx_uc_claims_developer_id → idx_uc_reservations_developer_id, RLS policy specbox_deny_anon_uc_claims → specbox_deny_anon_uc_reservations. Idempotent (re-apply safe) + hardened against the migration-runner re-apply race where 0003 recreates an empty uc_claims alongside the renamed uc_reservations (UC-601, UC-602)."
      - "feat(coordination): server/coordination/claims.py renamed to server/coordination/reservations.py with full identifier rename — Claim → UCReservation, AlreadyClaimedError → AlreadyReservedError (code ALREADY_RESERVED), NotClaimOwnerError → NotReservationOwnerError (code NOT_RESERVATION_OWNER), claim_uc → reserve_uc, get_claim → get_reservation, list_active_claims → list_active_reservations, claimed_uc_ids_by_others → reserved_uc_ids_by_others, Claim.claimed_at → UCReservation.reserved_at, to_conflict → to_payload (with backwards-compat alias kept until v5.37.0 / UC-612). UCReservation.to_public() returns exactly {uc_id, developer_id, reserved_at, branch} (UC-602)."
      - "feat(mcp): MCP tool surface renamed — tools/coordination.py registers reserve_uc / release_uc with descriptions in Spanish (\"Reservar un UC...\", \"Liberar la reserva...\"). Payload contract: success returns code=RESERVED + reserved_at + summary \"reservado\"; conflict returns code=ALREADY_RESERVED + owner/reserved_at/branch; release error returns code=NOT_RESERVATION_OWNER. Two new tests assert zero legacy 'claim' tokens in any key or stringified value of the wrapper payload, including str(exception) (UC-603)."
      - "feat(deprecation): tools/coordination.py registers claim_uc as a deprecated alias of reserve_uc for the v5.35-v5.36 window. The alias (a) emits a single DeprecationWarning with stacklevel=2 pointing at the caller (message names claim_uc, reserve_uc, v5.35.0, v5.37.0), (b) logs a structured deprecated_tool_called event with tool/since_version/remove_in_version/replacement, (c) returns a DUAL payload carrying both vocabularies side by side — reserved_at + claimed_at (same value), code + legacy_code (RESERVED↔CLAIMED, ALREADY_RESERVED↔ALREADY_CLAIMED). Auth-failure codes pass through untouched. UC-612 will remove this entire block in v5.37.0 (UC-604)."
      - "test: tests/test_coordination_claims.py renamed to tests/test_coordination_reservations.py via git mv + 7 test function renames (test_claim_uc_* → test_reserve_uc_*, TestClaimsRacePG → TestReservationsRacePG, etc.). New test_deprecated_claim_uc_alias_emits_warning asserts the AC-02 contract inside the renamed file. Dedicated 10-test deprecation suite at tests/test_deprecated_claim_uc_alias.py. 124 / 124 native + coordination + deprecation tests pass against Postgres 16-alpine (UC-605)."
      - "docs(engine): CLAUDE.md table updated (\"Reservations + branches\" row + tools row mentions reserve_uc primary + claim_uc deprecated alias), explicit v5.35.0 vocabulary note inline; ENGINE_VERSION.yaml bumped 5.34.1 → 5.35.0 with codename \"Reservation Rename\" and this changelog entry; doc/app/app_spec.md zone canonical_decisions documents the rename + deprecation window + v5.37.0 removal target (UC-606)."
      - "decision: deprecated alias claim_uc stays registered for two minor releases (v5.35.0-v5.36.x). UC-612 removes the alias, the dual payload fields (claimed_at, legacy_code), the legacy code aliases (CLAIMED, ALREADY_CLAIMED), the DeprecationWarning machinery, and the deprecated_tool_called log event — all in one barrier release. Rationale: callers (Control Panel + future external clients) need a measurable window to migrate; the DeprecationWarning + structured log give operators a way to quantify legacy usage before the removal."
      - "compat: 100% backwards-compatible during v5.35-v5.36. Existing callers invoking claim_uc keep working (they get a DeprecationWarning + dual-vocabulary payload). Existing callers invoking reserve_uc see only the new vocabulary in their payload (no legacy keys, no warning). The cross-language wire-protocol payload key in .quality/active_uc.json is kept as 'claim' temporarily via the documented _NATIVE_RESERVATION_CACHE_KEY = 'claim' compat constant; UC-613 (scheduled before UC-612) renames the wire protocol end-to-end (JSON key + Node hook + REST endpoint /api/native/claim-status → /reservation-status) so v5.37.0 closes the entire rename with zero residual debt."

  5.34.1:
    date: 2026-05-23
    summary: >
      Patch on top of v5.34.0 "Native Collaboration": adds N×N guided backend
      switching across the four backends (FreeForm/Trello/Plane/Native) and
      hardens the Native Backend against mutations from revoked identities
      (30s cached gate + destructive-op audit log + redesigned identity model).
    changes:
      - "feat(migration): N×N migration across the four backends — server/migration/ package with backend_dispatch (build_backend for all 4) + write_target (generic, idempotent via external_id) + state_mapping (canonical↔native matrix; Plane is the only lossy backend, degradations surfaced as structured warnings) + native_handling (Native exit discards claims/identity with report; Native entry seeds expected_version=1 + developer identity)"
      - "feat(migration): migrate_backend(source,target,dry_run) MCP tool — additive (origin intact) + idempotent (re-running skips already-migrated items via external_id). Replaces the Trello↔Plane-only migrate_project"
      - "feat(migration): switch_backend generalized to all 4 backend types with TRANSACTIONAL update of the 3 sources of truth (projects.json registry, doc/app/app_spec.md tracking_backend zone, .claude/settings.local.json specbox.backend_type) + snapshot rollback on failure"
      - "feat(migration): regenerate_evidence MCP tool — opt-in post-migration tool that rescans .quality/evidence/*/acceptance/results.json (indexed by logical uc_id) and re-runs run_acceptance_check per UC against current code; reports [X/N] UC-XXX: PASS|FAIL|SKIP progress + final summary + persists doc/migrations/evidence_regeneration_{ts}.md"
      - "feat(skill): /switch-backend guided orchestrator (.claude/skills/switch-backend/, context: direct). End-to-end UX: detect current backend → ask destination → secure credential collection (Native via SPECBOX_NATIVE_DSN env, never via chat) → mandatory dry-run preview → literal confirmation → migrate → transactional switch → 4-section final report (switch+consistency / evidence intact / Native discarded state if applicable / offer regenerate_evidence). MCP-local precondition documented"
      - "feat(native-security): mutation gate with hardcoded 30s TTL cache on the 9 NativeBackend mutators (create_item, update_item, archive_item, mark_acceptance_criterion, create_acceptance_criteria, update_acceptance_criterion, delete_acceptance_criterion, add_comment, add_attachment). After a revoke from the panel, the next cached miss raises UnauthenticatedError — exposure window ≤ 30s, down from hours. Reads bypass the gate by design so forensics + whoami stay available for revoked tokens"
      - "feat(native-security): audit_log for destructive operations — delete_acceptance_criterion and archive_item write a row to audit_log on success (developer_id + project_id + operation + target_id + occurred_at). Failed destructive ops leave the table untouched. Non-destructive mutators never write audit"
      - "feat(native-security): redesigned identity model — new tables github_identities (N:1 → developer, covers freelance with multiple GitHub accounts; github_user_id as stable BIGINT PK) and mcp_tokens (revocable via revoked_at, no TTL, separated from developers.token_hash which is dropped atomically in the same migration). Helpers register_mcp_token (idempotent ON CONFLICT) + revoke_mcp_token NOT exposed as MCP tools — only the future SpecBox Control Panel issues/revokes"
      - "feat(native-security): NativeBackend.__init__(project_id, dev_token) both arguments mandatory; auth_gateway dispatch forwards dev_token from session config; store_native_credentials + set_auth_token reject empty dev_token at the entry point with MISSING_DEV_TOKEN"
      - "refactor(native-security): register_native_developer MCP tool REMOVED. CRUD of developers / github_identities / mcp_tokens is now exclusively the responsibility of the (future) SpecBox Control Panel. The MCP keeps only whoami, claim_uc, release_uc, register_native_branch for native coordination"
      - "refactor(coordination): resolve_developer now queries mcp_tokens JOIN developers WHERE revoked_at IS NULL — a token revoked from the panel makes the next gate miss fail UNAUTHENTICATED. register_developer signature stripped to (developer_id, display_name) — identity only"
      - "fix(db): 0002_developers.sql idempotency latent bug — CREATE UNIQUE INDEX on developers.token_hash was not guarded against column absence. Re-applying the full ladder after 0005 drops the column failed with 'column does not exist'. Fixed with a DO block + information_schema check so 0002 is truly self-idempotent regardless of 0005 state"
      - "chore(security): depersonalize Supabase references in public repo — replaced the maintainer's specific project_ref (nywjsvumsvxlpflpbord) and project name (SpecBox-DataBase) with generic placeholders across docs, tracking, test fixtures and CHANGELOG/CLAUDE.md/ENGINE_VERSION.yaml. The runbook is now a generic operator guide; every MCP operator provisions and operates their own Supabase instance"

  5.34.0:
    date: 2026-05-22
    codename: "Native Collaboration"
    changes:
      - "feat: new Native Backend — a fourth SpecBackend implementation (alongside Trello / Plane / FreeForm) backed by a managed Supabase Postgres instance, designed for multi-developer team collaboration where a single source-of-truth board is shared across developers. server/backends/native_backend.py implements all 26 methods of the SpecBackend ABC over an asyncpg pool. Opt-in per project: get_session_backend in server/auth_gateway.py dispatches to NativeBackend only when backend_type='native'; the three existing backends remain the default. The DB credential is read exclusively from the SPECBOX_NATIVE_DSN environment variable and is NEVER stored on disk or in meta.json (Frontier 2 — credential security)"
      - "feat: multi-tenant Postgres schema (server/db/migrations/0001_native_schema.sql) with optimistic-concurrency guards. Updates to US/UC carry an expected_version (passed via meta['expected_version'] to keep the ABC signature intact) and a mismatch raises a conflict instead of silently overwriting a teammate's change. The pool lives in the same module and is verified against a local Postgres dev instance (docker-compose.dev.yml, postgres:16 on port 55432) and against the production Supabase instance"
      - "feat: developer identity + authorization (H2). Migration 0002_developers.sql adds a developers table (developer_id PK, display_name, hashed token). server/coordination/identity.py resolves a token → developer, enforces Frontier 1 authz (UNAUTHENTICATED when the token is unknown, FORBIDDEN when a developer touches a project they are not a member of). New MCP tools whoami() and register_native_developer()"
      - "feat: UC claims + branch registry (H3). Migration 0003_claims.sql plus server/coordination/claims.py and server/coordination/branches.py let a developer claim a UC (preventing two teammates from implementing the same UC concurrently) and register the feature branch tied to a claim. New MCP tools claim_uc(), release_uc(), register_native_branch()"
      - "feat: Native Backend migrated from a self-hosted Postgres-on-VPS to a managed Supabase instance (Postgres 17+, region chosen by the operator). The native suite (tests/test_native_*.py) runs green against the maintainer's Supabase instance — 50 passed, 0 skipped — validating the cutover end-to-end. Every MCP operator is responsible for provisioning their own Supabase instance; the public repo does not document any specific project ref"
      - "fix(dashboard): the Sala de Máquinas /health endpoint now reads the real engine version from ENGINE_VERSION.yaml instead of a hardcoded string, so the dashboard reflects the deployed version accurately"
      - "build(docker): Dockerfile gains a CACHEBUST ARG to force a fresh re-copy of the engine on EasyPanel rebuilds, fixing stale-layer deploys on the VPS"
      - "decision: Native Backend is opt-in and additive — it is a fourth backend, not a replacement. Projects that do not set backend_type='native' behave exactly as before. This keeps the release a minor bump with zero breaking changes to Trello / Plane / FreeForm users"
      - "decision: the native DB credential lives only in SPECBOX_NATIVE_DSN (env), never persisted, so a leaked meta.json or board export cannot expose database access. Optimistic concurrency (expected_version) was chosen over locking to avoid a teammate holding a stale lock blocking the whole team"
      - "compat: 100% backwards-compatible. The SpecBackend ABC is unchanged in signature (expected_version flows through meta to avoid breaking the three existing backends). detect_project_backend keeps its 5-level priority chain; native is only selected when explicitly configured. Projects without SPECBOX_NATIVE_DSN never instantiate the native pool"
      - "tests: native suites — test_native_schema.py, test_native_backend_conformance.py (parametrized SpecBackend conformance, the suite that did not exist pre-H1), test_native_dispatch.py, test_native_pool_supabase.py, plus the _native_db.py harness. 50 passed against real Supabase. Pre-existing failures on main (test_spec_mutations InMemoryBackend mock missing archive_item) documented in prior releases remain and are unrelated"

  5.33.0:
    date: 2026-05-13
    codename: "FreeForm Path Safety"
    changes:
      - "feat: new PreToolUse hook .claude/hooks/freeform-path-guard.mjs that intercepts mcp__SpecBox-MCP__set_auth_token and mcp__SpecBox-MCP__onboard_project. When backend_type='freeform' and the FreeForm root path is relative (or the default 'doc/tracking' is implicit), the hook auto-rewrites it to an absolute path resolved against `git rev-parse --show-toplevel` via hookSpecificOutput.updatedInput. Exit 2 (block) only when the CWD is not a git repo and the path cannot be resolved unambiguously. Every rewrite is logged to .quality/logs/freeform-path-rewrites.jsonl for audit. Registered in settings.json under a new PreToolUse matcher 'mcp__SpecBox-MCP__(set_auth_token|onboard_project)' with 3s timeout"
      - "feat: new MCP tool detect_local_root_path() in server/tools/onboarding.py. Read-only handshake that declares the FreeForm path-resolution contract — requires_absolute_path, default_relative_path, client_resolution_recipe (`git rev-parse --show-toplevel`), and the hook helper path. Serves as executable documentation for /app-init, claude.ai mobile clients, and external integrations that talk to the MCP without Claude Code hooks installed"
      - "feat: /app-init SKILL.md Paso 2.3 reinforced. New 3-step handshake: (1) call detect_local_root_path() first to declare the contract, (2) resolve ABS_TRACKING from PROJECT_ROOT computed in Paso 1, (3) pass the absolute path to set_auth_token. Adds explicit note about the hook as defense in depth — the skill still passes the absolute explicitly, the hook is the safety net for non-Claude-Code clients"
      - "decision: auto-rewrite silencioso preferred over block-with-message. The harness's PreToolUse protocol supports hookSpecificOutput.updatedInput (exit 0) to mutate tool args before the call, so the bug becomes mechanically impossible instead of a user-visible error. Server-side guard FREEFORM_PATH_MUST_BE_ABSOLUTE (v5.29.0) remains as last-resort defense"
      - "decision: 3-layer defense kept additive — Layer 1 /app-init explicit, Layer 2 hook universal, Layer 3 server-side reject. Each layer is independent and reinforces the others without coupling. Removing any one layer does not unblock the bug while the others stand"
      - "decision: hook covers both set_auth_token (root_path arg) and onboard_project (freeform_root_absolute arg), and also the implicit case where onboard_project is called with no backend_type AND no trello_board_name (engine defaults to freeform). Tested across 8 scenarios — relative path, absolute path, non-watched tool, trello backend, implicit freeform, empty default, non-git CWD block, audit log written"
      - "compat: 100% backwards-compatible. Pre-v5.33 clients (no hook installed) keep hitting the v5.29 server-side guard with the same error message. New clients get the silent auto-rewrite. /app-init from v5.29-v5.32 keeps working — the SKILL change only adds the new handshake step, the legacy ABS_TRACKING=\\$(pwd)/doc/tracking pattern still produces the same absolute path"
      - "out-of-scope: extending the hook to claude.ai mobile (different transport, no PreToolUse hook support today). Mobile clients still rely on the server-side guard until Anthropic adds equivalent hook support. detect_local_root_path() partially compensates by surfacing the contract via MCP discovery"

  5.32.1:
    date: 2026-05-02
    codename: "Release Skill — README + CHANGELOG enforcement"
    changes:
      - "feat: /release SKILL.md gains 4 new mandatory steps. Paso 4.5 'Actualizar README.md' enforces bumping the Spanish subtitle, the 'Lo nuevo en vX' block, the English subtitle, and the 'What's new in vX' block — preserving historical blocks instead of replacing them. Paso 5.5 'Actualizar CHANGELOG.md' enforces inserting a new top-of-file entry with Added/Changed/Decisions/Compatibility/Tests sections. Paso 7 'Pre-commit Consistency Check' runs the new validator before allowing the commit. Paso 6.2 git add now lists README.md and CHANGELOG.md explicitly"
      - "feat: new .quality/scripts/version-consistency-check.mjs — zero-deps validator that reads ENGINE_VERSION.yaml as canonical and verifies the version appears in pyproject.toml, CLAUDE.md (header + Engine Version footer), CHANGELOG.md (top entry), and README.md (ES + EN subtitles). Per-file diagnosis to stderr: OK / MISMATCH (got X.Y.Z) / MISSING. Exit 0 = aligned, exit 1 = at least one file out of sync. /release Paso 7 invokes it as a hard block before the commit"
      - "feat: tests/scripts/version-consistency-check.test.mjs — 8 smoke tests with synthetic mini-repos in /tmp covering happy path, README out of sync, CHANGELOG missing new entry, CLAUDE.md header forgotten, pyproject misaligned, ENGINE_VERSION.yaml unreadable (canonical missing), README file absent, and several files out of sync simultaneously"
      - "decision: convertir la regla 'README en cada bump' (que vivía en memoria persistida desde v5.31.1) en un guardrail mecánico verificable. Misma filosofía que aplicamos en v5.32 con Task isolation guards: no confiar en convenciones, hacerlas verificables. La memoria sigue presente para sesiones que aún no carguen el SKILL actualizado"
      - "decision: el validador ABORTA la release en exit 1 — NO es advertencia. Si tiene falso positivo, reportarlo como bug en lugar de saltarse el bloqueo (igual que el resto de hooks v5.32)"
      - "compat: 100% backwards-compatible. Ninguna release pre-v5.32.1 se vio afectada — el validador solo se invoca desde el nuevo Paso 7 del SKILL. Proyectos que usan la skill /release de versiones anteriores siguen funcionando sin el guardrail (degradación graceful: solo se pierden los nuevos steps, no rompe nada)"

  5.32.0:
    date: 2026-05-02
    codename: "Implement Task Isolation"
    changes:
      - "feat: execution_context.json — `.quality/evidence/{feature}/execution_context.json` persists branch/feature/stack/board_id/plan_hash atomically (tempfile + os.replace, idempotent on unchanged content). Each Task delegated by /implement reads this file instead of receiving these values verbatim in its prompt — fixes the root cause of orchestrator context exhaustion. Helpers in server/implement_context/execution_context.py (Pydantic, extra='forbid') and .claude/hooks/lib/execution-context.mjs (read-only for hooks). 18 tests"
      - "feat: context-budget-guard.mjs — PreToolUse(Task) hook estimating prompt tokens via chars/4 heuristic. Settings: specbox.implement.task_isolation.{task_budget_tokens=16000, task_budget_mode=warn|strict|off}. warn (default) emits stderr WARNING and exit 0; strict emits BLOCKED + exit 2 with actionable message ('move shared context to execution_context.json'). Bumps tasks_run_total / tasks_failed_budget counters in .quality/task_isolation.json. Token counter at lib/token-counter.mjs is zero-deps. 11 tests"
      - "feat: file-ownership-guard.mjs — PreToolUse(Write/Edit) hook that validates the target path against the ownership of the active sub-agent (read from .quality/active_agent.json transient marker). Settings: specbox.implement.task_isolation.ownership_mode=warn|strict|off. Always blocks suspicious paths (../, /abs) regardless of mode. Unknown agent → fail-open WARNING. Suggests the correct owner when blocking ('Path supabase/migrations/01.sql is owned by AG-03'). Parser at lib/ownership-map.mjs reads .claude/skills/implement/file-ownership.md as source of truth (no JSON copy that would drift). Token-by-token glob → regex handles /**/ mid-pattern, leading/trailing **, single * and ? without crossing /. 23 tests"
      - "feat: phase_outputs.jsonl — append-only structured delta per Task at .quality/evidence/{feature}/phase_outputs.jsonl. Schema: {schema_version, ts, phase, phase_index, agent, status, files_created/modified/deleted, summary, duration_s, tokens_used_*, healing_attempts, error}. Pydantic model with extra='forbid'. aggregate_for_spec_sync() collapses entries (deduped first-seen-order) for Spec-Code Sync. Zero-deps validator at .quality/scripts/validate-phase-outputs.mjs. Contract documented in doc/specs/phase-outputs-spec.md. 17 tests"
      - "feat: SKILL.md /implement updated. New 'Working set (v5.32.0)' banner documenting the four evidence files. New Paso 0.4b writes execution_context.json. New Paso 5.0 'Protocolo de delegacion' is a reusable block applied before/after every Task(AG-XX): write active_agent.json, build prompt that points to execution_context.json (does NOT repeat branch/feature/stack in prose), spawn Task, delete active_agent.json, bump task_isolation counters. Paso 5.1.1b and 8.5.1a now consume aggregate_for_spec_sync(feature) instead of the orchestrator's in-memory implementation_deltas. Falls back to legacy git diff path when phase_outputs.jsonl is empty (compat)"
      - "feat: heartbeat-sender.mjs adds task_isolation field AFTER the v5.31 Stitch Autopilot block (preserves handoff_present, context_pressure, stitch_quota intact). Best-effort: null when .quality/task_isolation.json is absent. Surface to Sala de Maquinas: enabled, tasks_run_total, tasks_failed_budget, tasks_failed_ownership, last_feature_slug, last_event_at"
      - "feat: settings registered. file-ownership-guard.mjs in PreToolUse(Write) and PreToolUse(Edit) AFTER pipeline-phase-guard. context-budget-guard.mjs in PreToolUse(Task) — new matcher. settings.json validated."
      - "decision: warn mode is the default for both new guards. Promotion to strict is a settings flip after 2 weeks of telemetry — not a code change."
      - "decision: did NOT redesign /implement. The SKILL.md already documented Task delegation (lines 469-536, 496-506); v5.32 implements the 5 guardrails (G1-G5) that were missing for that contract to be mechanically forced and observable."
      - "decision: healing keeps running inside the same Task that failed (no separate healing Task). Moving healing to its own isolated Task is deferred to v5.32.1 — minimalist first release."
      - "compat: 100% backwards-compatible. The v1 hooks (quality-first-guard, healing-budget-guard, pipeline-phase-guard, stripe-safety-guard) keep running in Write/Edit. New guards run AFTER them. Legacy /implement runs without execution_context.json or phase_outputs.jsonl degrade gracefully — guards become no-ops, heartbeat field stays null. Spec-Code Sync falls back to git diff when phase_outputs.jsonl is empty."
      - "tests: 69 new tests, all green. test_implement_context.py (18), test_phase_outputs.py (17), context-budget-guard.test.mjs (11), file-ownership-guard.test.mjs (23). Pre-existing failures on main (test_acceptance_check::test_registers_two_tools, test_spec_mutations / test_milestone_management TypeErrors documented in v5.29 changelog) unrelated and persist."

  5.31.1:
    date: 2026-05-02
    codename: "Stitch Autopilot — /plan migration"
    changes:
      - "feat: /plan Paso 6.3 migrated from `mcp__stitch__generate_screen_from_text` (v1) to the v5.31.0 v2 pipeline. Each prompt now goes through `validate_stitch_prompt` (warn mode) BEFORE generation, then through `stitch_generate_screen_v2` which applies the fallback chain edit_baseline → variants_refine → regenerate automatically. Skill no longer instructs the agent to retry manually on timeout — the orchestration layer handles it"
      - "feat: new /plan Paso 5.5 'Stitch Autopilot — Pre-check' between Paso 5 (save plan) and Paso 6 (generate). Three substeps: 5.5.1 verify `doc/design/DESIGN.md` exists (auto-generate from Brand Kit if not, warn user if neither exists), 5.5.2 register DESIGN.md against the Stitch project via `upload_design_md_to_stitch` (mode=inline-prefix), 5.5.3 quota pre-warning via `get_stitch_quota_status` with a tiered action table (<80% silent, 80-100% ask, ≥100% block until safety net opt-in or reset)"
      - "feat: new /plan Paso 6.7 'Multi-pantalla con batching' for plans with >5 related screens. Uses `stitch_build_site_batched_v2` which auto-partitions into ≤4-screen groups (priority: explicit `group` tag → route prefix → order chunks) and applies a unified theme pass across all generated screens. Documented when to use vs. when to keep the serial 6.3 flow (independent screens stay serial)"
      - "feat: new /plan Paso 6.3.1 prompt validation step with action table for valid+warnings, requires_split, and strict-mode invalid responses. Paso 6.3.3 documents incremental refinement via `baseline_screen_id` so the fallback chain can prefer `edit_baseline` over `regenerate` when a previous version exists"
      - "compat: 100% backwards-compatible. The v1 tools (mcp__stitch__generate_screen_from_text et al.) remain registered but are no longer invoked from /plan. Projects that customised the Paso 6 prompts in their own forks will need to merge the new validator/v2 flow when they sync; no settings change required for the default behaviour"
      - "decision: model default stays GEMINI_3_PRO. flash_safety_net stays opt-in (off by default) — calidad-first. The validator stays in 'warn' mode by default; promotion to 'strict' is a settings flip when telemetry confirms low false-positive rate"

  5.31.0:
    date: 2026-05-02
    codename: "Stitch Autopilot"
    changes:
      - "feat: DESIGN.md canonical format adopted (github.com/google-labs-code/design.md). New server/design_md/ module with Pydantic schema (hex-or-{token.ref} validation rejecting named colors at parse time), generator that synthesises a DESIGN.md from optional inputs (brand_kit.md, veg.md, app_prd.md vision zone, app_spec.md), 6 VEG archetype defaults (corporate / startup / creative / consumer / gen_z / gov), serializer with fixed section order per spec, and signature-based drift detection (excludes generated_at from hash). 38 tests"
      - "feat: two new MCP tools — generate_design_md_tool (synthesises doc/design/DESIGN.md, idempotent, persists provenance + signature in meta.json) and upload_design_md_to_stitch (registers DESIGN.md against a Stitch project; mode=inline-prefix today since the Stitch MCP has no native attach endpoint, upgrades transparently if Google adds one). 15 tests"
      - "feat: /visual-setup gains Paso 3.7 (generate DESIGN.md) + Paso 3.8 (confirmation block) right after the existing 3.6. Existing visual-setup flow unchanged; the new step runs after the Brand Kit and Stitch design system are configured"
      - "feat: 4-layer prompt template v2 (Context / Components / Style / Platform) per Google Stitch's official prompting guide. Builder at server/stitch_prompt/builder.py, validator at server/stitch_prompt/validator.py with E1 (named colors → auto-resolve from DESIGN.md palette or reject), E2 (layout + components mixing → propose split, robust against single-line mixed intents via sentence boundary splitting), W1 (>500 char body excluding DESIGN.md prefix), W2 (>80 word Layer 1), W3 (Layer 2 as prose). Default mode is 'warn' for backwards-compat — strict is a settings flip, not a code change. New MCP tool validate_stitch_prompt. 25 tests"
      - "feat: fallback chain at server/stitch_orchestration/fallback.py — Strategy ladder edit_baseline → variants_refine → regenerate, with optional flash_safety_net last-resort that marks results degraded=True. Error classification (transient | quota | content | unknown) drives retry decision. Skips baseline-dependent strategies if no baseline_screen_id. 14 tests with a scriptable in-memory FakeOps stand-in"
      - "feat: batched build_site at server/stitch_orchestration/batching.py — partitions screens into groups of ≤batch_size (priority: explicit 'group' tag → route prefix → order chunks), runs Stitch's native build_site per partition, applies a final unifying edit_screens pass when >1 batch is needed. New MCP tool stitch_build_site_batched_v2. 13 tests"
      - "feat: new MCP tool stitch_generate_screen_v2 wrapping the fallback chain over the real StitchClient via a thin _StitchOpsAdapter. Default model GEMINI_3_PRO (calidad-first). flash_safety_net is OFF by default — must be opted into via settings.local.json or per-call to engage Flash as last resort"
      - "feat: quota tracking at server/stitch_quota/computation.py — pure aggregator over stitch_usage.jsonl by calendar month and model class (Pro=Experimental 200/mo, Flash=Standard 350/mo, Google's published ceilings with no upgrade path). classify_model treats unknowns as PRO since that's the SpecBox default; counts only successful generation calls; metadata operations and validations don't consume. compute_quota_payload derives summary, warning at >=80%, exhausted at 100%, reset_at on the first day of next UTC month with year-rollover. 26 tests"
      - "feat: new MCP tool get_stitch_quota_status with optional write_cache=True that persists a compact summary at {project_root}/.quality/stitch_quota.json so heartbeat-sender.mjs picks it up without re-invoking the tool"
      - "feat: heartbeat-sender.mjs gains a stitch_quota field appended AFTER the v5.30.0 Session Continuity block (handoff_present / context_pressure preserved intact). Best-effort: when the user has never run get_stitch_quota_status, the field stays null and Sala de Máquinas hides the indicator gracefully"
      - "feat: new PreToolUse hook .claude/hooks/stitch-quota-guard.mjs. Warns at >=80% on PRO or Flash bucket (exit 0). Blocks (exit 2) when PRO is exhausted AND flash_safety_net is OFF in settings. No-op for non-Stitch tools and when no quota cache exists. The hook only reads the cache; it never re-invokes the quota tool"
      - "feat: design/stitch/prompt-template-v2.md — human-readable doc of the 4-layer template + the rules the validator enforces. Pairs with the legacy template-v1 which stays in place for backwards compat"
      - "decision: model default stays GEMINI_3_PRO. The user's stated priority is calidad-first; the plan considered defaulting to Flash but rejected it. Flash is exclusively a safety net, opt-in via specbox.stitch.fallback.flash_safety_net=true"
      - "decision: slot v5.31.0 was originally reserved by the v5.30.0 commit message for 'delegación de fases de /implement a Tasks aisladas'. After confirming there were no open PRs or active branches for that work, the slot was reassigned to Stitch Autopilot — higher priority for unblocking autopilot today. The /implement phase delegation moves to a future v5.32+ with its own dedicated plan"
      - "compat: 100% backwards-compatible. v1 Stitch tools (the 13 originals: stitch_set_api_key … stitch_build_site) stay registered alongside the new v2 tools. /plan and /implement skills are NOT modified in this release — they continue to use v1 tools by default. Projects opt into v2 by calling the new tools explicitly. A follow-up patch release (v5.31.1 if needed) will migrate /plan Paso 2.5b to use the new pipeline once telemetry from the warn-only validator confirms low false-positive rate"
      - "tests: 131 new tests, all green, isolated from pre-existing failures (test_acceptance_check::test_registers_two_tools, test_spec_mutations / test_milestone_management TypeErrors documented in v5.29 changelog)"

  5.30.0:
    date: 2026-05-02
    codename: "Session Continuity"
    changes:
      - "feat: new `/handoff` skill (.claude/skills/handoff/SKILL.md, context: direct) — persists fine-grained session state to .quality/handoff.md (human-readable narrative) AND to Engram as a structured JSON observation under topic key `session:<project>:<branch>`. Solves the gap where the mechanical checkpoint of /implement does not capture mid-session decisions, hot files, open questions, or next concrete step. The skill's flow: (1) build mechanical state via handoff-builder.mjs, (2) ask the model to produce 4 narrative sections, (3) render Markdown, (4) write file, (5) save Engram observation, (6) heartbeat with last_operation=handoff, (7) report to user"
      - "feat: SessionStart hook .claude/hooks/session-start.mjs (registered in settings.json under hooks.SessionStart). Reads .quality/handoff.md if fresh and emits its content as additionalContext to the new session via the standard `{hookSpecificOutput: {hookEventName, additionalContext}}` envelope. Capped at 14 000 chars (~3.5k tokens). Marks the handoff as [STALE] when older than ttl_minutes (default 1440). Falls back to active_uc + latest checkpoint + auto zones from app_spec.md when no fresh handoff exists. Net result: a brand new session arrives with exact recovered state instead of exploring the repo blindly"
      - "feat: pure handoff-builder library at .claude/hooks/lib/handoff-builder.mjs with public API computeSessionId / buildHandoffData / renderHandoff / writeHandoff. All mechanical fields are auto-populated from local state (git, .quality/active_uc.json, .quality/evidence/<feature>/checkpoint.json, healing.jsonl, FB-*.json, .claude/settings.local.json, doc/tracking/items.json signal). Deterministic 12-char session_id from cwd+date for cross-tool correlation. Built-in secret redaction: sk_live_*/sk_test_* and tokens >=32 chars before writing"
      - "feat: pre-read-budget-guard hook .claude/hooks/pre-read-budget-guard.mjs (registered as PreToolUse(Read)). Non-blocking: estimates tokens for the file being read (chars/4) and emits a warning to stderr when the file would consume >= warn_pct of the Claude window. Defaults: window_tokens=1_000_000, warn_pct=5. Configurable via .claude/settings.local.json → specbox.context_budget. Pushes the agent toward Grep / Explore / offset-limited Read when a full read is wasteful, without blocking the operation"
      - "feat: structured Engram payload at session_end. on-session-end.mjs replaces the v5.29 free-form `'Session ended at … | Files modified … | …'` string with a JSON payload `{type, schema_version, project, branch, ended_at, files_modified, context_tokens_est, healing_events, active_feature, handoff_path}` saved under topic key `session:<project>:<branch>`. Branch-scoped key enables `mem_search 'session:specbox-engine:feature/uc-021'` to retrieve the exact snapshot. Backwards-compatible: old observations remain readable, only the new emit shape is structured"
      - "feat: heartbeat-sender enriched with three new fields — handoff_present (bool), handoff_age_minutes (int|null), context_pressure ({tokens_est, pct_of_window, level}) where level ∈ {healthy, warn, critical} thresholded at 400k/700k tokens. The dashboard_api.py /api/heartbeat route accepts and persists them so the Sala de Máquinas can surface session continuity health per project"
      - "feat: handoff contract formalised in doc/specs/handoff-spec.md. Frontmatter (generated_at, generator, schema_version=1, project, session_id, trigger ∈ {manual, auto-pre-compact, session-end}, ttl_minutes, branch, active_uc) plus 7 mandatory sections. Validator at .quality/scripts/validate-handoff.mjs (zero deps, exit 1 with specific stderr on first failure). Template at templates/handoff.md.template. 5 fixtures under tests/fixtures/handoff/ cover valid-minimal / valid-full / invalid-missing-section / invalid-no-frontmatter / invalid-stale-ttl"
      - "feat: CLAUDE.md gains a new 'Session Continuity (v5.30.0)' section with the protocol claude must follow before proposing compactation: (1) run /handoff, (2) confirm success, (3) only then suggest compact/clear. Defines when handoff is mandatory (active UC, fresh checkpoint, before /clear) vs optional (exploratory sessions). Lists every component path and the heartbeat enrichment. The hooks table is updated to v5.30 with rows for session-start and pre-read-budget-guard; the skills table includes /handoff with trigger phrases"
      - "feat: analyze-sessions.sh new metric — Session Continuity block reports sessions_with_handoff / total_sessions and handoff_rate %. Targets: ≥80% green, 50-80% yellow, <50% red. Helps detect projects where Claude is skipping /handoff before compactation"
      - "tests: 19 new smoke tests (all green) — tests/hooks/handoff-builder.test.mjs (13: deterministic id, mechanical field population, active_uc / checkpoint / backend / healing / feedback detection, render with all sections, secret redaction, idempotent writes) and tests/hooks/session-start.test.mjs (6: empty repo, fresh handoff, stale handoff, fallback path, app_spec.md zone extraction, MAX_CHARS budget). Both runners use only node:assert/strict and node:fs to avoid an external test framework dependency"
