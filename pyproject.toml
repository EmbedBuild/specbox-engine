[project]
name = "specbox-engine"
version = "6.9.5"
description = "SpecBox Engine v6.9.5 — Tenant-Scoped Keys: native spec-table PKs move to composite (project_id, id) so two projects can share a logical id (US-01) in the same shared Postgres (fixes the FreeForm→Native ingest collision on user_stories_pkey, UC-707); /switch-backend handles the FreeForm exploded dialect (index.json + AC-in-markdown) via a pure normalizer + format pre-flight + native prerequisite gate (UC-709); stale tests realigned to the UC-660/UC-706 contracts (UC-708)."
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.3.1,<4.0.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "fpdf2>=2.8.0",
    "markdown>=3.5",
    "structlog>=24.0.0",
    "reportlab>=4.0.0",
    "asyncpg>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.22.0",
    "ruff>=0.5.0",
]
# Optional external tools for the Quality Audit (ISO/IEC 25010) module.
# All are auto-detected; missing tools degrade gracefully at runtime.
audit = [
    "semgrep>=1.70.0",
    "pip-audit>=2.7.0",
    "lizard>=1.17.0",
]

[project.scripts]
specbox-engine = "server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"

# asyncpg ships no type stubs / py.typed marker; ignore its missing imports.
[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true
