name: MCP — los dos nombres responden igual

# UC-5101 AC-02: mcp.specbox.build y mcp-specbox-engine.jpsdeveloper.com son el mismo
# servidor (misma versión, mismo rechazo de un token inválido, misma respuesta sin token).
# Sin token: la sesión con token se comprueba en local en cada /release (Paso 6.7), para no
# guardar en GitHub un token con acceso a los boards.

# US-121 (UC-12101): manual or weekly (Monday 07:30 UTC). The real check is `bash scripts/ci-local.sh hooks`,
# which runs the same locally before every PR. Launch by hand when closing a large block:
# gh workflow run mcp-hosts.yml -R EmbedBuild/specbox-engine --ref <branch>
on:
  schedule:
    - cron: '30 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pruebas del comprobador
        run: node --test scripts/check-mcp-hosts.test.mjs

      # UC-11012: el recorrido FreeForm en vivo va con el token de dispositivo, en local
      # (doc/runbooks/mcp-smoke-freeform.md); aquí solo sus pruebas, sin red.
      - name: Pruebas de la prueba de humo de FreeForm
        run: node --test scripts/smoke-freeform-remote.test.mjs

      - name: Comparar los dos nombres en vivo
        run: node scripts/check-mcp-hosts.mjs
