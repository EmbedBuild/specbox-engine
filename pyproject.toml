[project]
name = "specbox-engine"
version = "6.11.1"
description = "SpecBox Engine v6.11.1 — Living Funnel: the engine publishes its own state (US-16) and capability inventory (US-20) to the site on every /release, and the VSCode extension emits an idempotent activation event (US-26) to close the site funnel — page_view→cta_click→install_intent→activation as one correlated, PII-free conversion."
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.3.1,<4.0.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "fpdf2>=2.8.0",
    "markdown>=3.5",
    "structlog>=24.0.0",
    "reportlab>=4.0.0",
    "asyncpg>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.22.0",
    "ruff>=0.5.0",
]
# Optional external tools for the Quality Audit (ISO/IEC 25010) module.
# All are auto-detected; missing tools degrade gracefully at runtime.
audit = [
    "semgrep>=1.70.0",
    "pip-audit>=2.7.0",
    "lizard>=1.17.0",
]

[project.scripts]
specbox-engine = "server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"

# asyncpg ships no type stubs / py.typed marker; ignore its missing imports.
[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true
