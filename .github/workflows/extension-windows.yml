name: Extension on Windows

# US-96 — la instalación de skills de la extensión, con junctions de verdad. Un borrado recursivo
# sobre un junction puede vaciar la carpeta a la que apunta (UC-9601): estas pruebas instalan dos
# veces sobre una copia del engine versionada en git y comprueban que no falta nada. En los runners
# rmSync quita el junction limpio, así que no reproducen aquel borrado (lo cubren las pruebas con el
# sistema de ficheros simulado); comprueban el resultado con junctions reales. En macOS y Linux las
# mismas pruebas usan enlaces simbólicos (npm test en oauth-e2e.yml).

# US-121 (UC-12101): manual only. Windows is the one platform the local CI cannot
# reproduce: launch it by hand when a PR touches vscode-extension/src/{util,install,health,
# constants}.ts or vscode-extension/tests/skills-*.test.mjs:
# gh workflow run extension-windows.yml -R EmbedBuild/specbox-engine --ref <branch>
on:
  workflow_dispatch:

jobs:
  skills:
    name: Skills con junctions (Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        # Node de las versiones de Electron que usa VSCode y la actual.
        node: ['20', '22', '24']
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        working-directory: vscode-extension
        run: npm ci
      - name: Compile
        working-directory: vscode-extension
        run: npm run compile
      - name: Skills tests
        working-directory: vscode-extension
        shell: bash
        run: node --test tests/skills-*.test.mjs
