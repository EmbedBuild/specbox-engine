<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel con tells</title>
<style>
  body { margin: 0; font: 16px/1.5 Arial, sans-serif; color: #111; background: #fff; }
  .degradado { background: linear-gradient(90deg, #7c3aed, #06b6d4); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .aviso { border-left: 4px solid #7c3aed; padding: 12px; width: 300px; }
  .antetitulo { text-transform: uppercase; letter-spacing: .12em; font-size: 12px; margin: 0; }
  .boton { transition: all .2s; min-height: 44px; padding: 8px 16px; }
  .tenue { color: #bbbbbb; }
  .peque { min-height: 0; height: 24px; width: 24px; padding: 0; }
  .ancha { width: 600px; }
  .cargando { width: 24px; height: 24px; border: 3px solid #111; border-top-color: transparent; border-radius: 50%; animation: gira 1s linear infinite; }
  @keyframes gira { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <h1 class="degradado">Bienvenido a tu panel</h1>
  <div class="aviso">Tienes tareas pendientes</div>
  <p class="antetitulo">Novedades</p>
  <h2>Lo que ha cambiado esta semana</h2>
  <button class="boton">Guardar cambios</button>
  <button class="icono" aria-label="Lanzar">🚀</button>
  <p class="tenue">Texto gris claro sobre blanco</p>
  <button class="peque" aria-label="Cerrar">x</button>
  <div class="ancha">Una tabla que no se reconvierte</div>
  <p>Ingresos del mes: 12.400 € y 81 % de aceptación</p>
  <table>
    <tr><td>Reforma cocina</td><td class="importe">1.250 €</td></tr>
    <tr><td>Baño</td><td class="importe">980 €</td></tr>
  </table>
  <div class="cargando" role="status" aria-label="Cargando"></div>
</body>
</html>
